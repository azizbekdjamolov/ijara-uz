services:
  db:
    image: postgres:16-alpine
    container_name: ijara_db
    environment:
      POSTGRES_DB: ijara
      POSTGRES_USER: ijara
      POSTGRES_PASSWORD: ijara_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ijara -d ijara"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ijara_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ijara_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ijara
      MINIO_ROOT_PASSWORD: ijara_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: ijara_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  pgdata:
  miniodata: