[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PERF", "RUF"]
ignore = [
    "RUF012",
    "B008",
    "E501",
    "F403",
    "F405",
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["E402", "F403", "F405"]